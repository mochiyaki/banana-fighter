[project]
name = "banana-fighter"
version = "0.1.0"
description = "Recursive training harness: an LLM-driven game bot that plays, evaluates itself, rewrites its strategy, and tries again."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
raindrop = ["raindrop-ai>=0.0.56"]
all = ["pymongo>=4.6", "raindrop-ai>=0.0.56"]

[project.scripts]
banana-fighter = "banana_fighter.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["banana_fighter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
